name: volley_stats
description: >-
  Logica pura di Volley Scout Stratego, condivisa fra l'app mobile e la
  dashboard stagionale web. Regola secca: qui dentro NON entrano drift,
  flutter_riverpod, AppLocalizations né BuildContext — se compila con il solo
  `flutter`, gira anche sul web (vedi docs/dati-stagionali.md).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

# Membro del pub workspace dichiarato nel pubspec della root: un solo
# `flutter pub get`, un solo pubspec.lock, e versioni delle dipendenze
# condivise per costruzione — app e dashboard non possono divergere.
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # La stagione dimostrativa, nel formato backup. Vive qui, nel package dei
    # DATI, perché la usano in due: la vetrina web la mostra a chi arriva senza
    # l'app, e il bottone demo dell'app (solo debug) la carica nel database.
    # Due copie dello stesso file divergerebbero al primo aggiornamento.
    # Si riferisce come `packages/volley_stats/assets/backup_demo.json`.
    # Si rigenera con gli script in packages/volley_web/tool/.
    - assets/backup_demo.json
