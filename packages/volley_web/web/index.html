<!DOCTYPE html>
<html lang="it">
<head>
  <!--
    Sostituito da `flutter build web --base-href`. Servito dalla radice di un
    dominio (…pages.dev) resta "/". Sbagliarlo dà una pagina BIANCA senza
    nessun errore: è la prima cosa da verificare dopo una pubblicazione.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Statistiche di stagione per la pallavolo: efficienza in attacco, positività in ricezione, andamento nel tempo di ogni giocatrice. Carica il backup di Volley Scout Stratego, i dati restano nel tuo browser.">
  <meta name="theme-color" content="#1E3A8A">

  <!--
    Metà del traino in questo settore è il link incollato in WhatsApp o in un
    gruppo: senza queste righe l'anteprima mostra l'indirizzo nudo.
    ATTENZIONE: og:url e og:image vogliono URL ASSOLUTI. Se il Worker cambia nome
    (o arriva un dominio vero), vanno aggiornati qui e va rifatta la build
    (vedi docs/deploy-dashboard.md).
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Volley Scout Stratego">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Statistiche di stagione — Volley Scout Stratego">
  <meta property="og:description" content="Come sta andando la squadra, e ogni giocatrice, nell'arco della stagione. Nessuna registrazione: i dati restano nel tuo browser.">
  <meta property="og:url" content="https://volley-stratego.branduich.workers.dev/">
  <meta property="og:image" content="https://volley-stratego.branduich.workers.dev/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Nome sotto l'icona: corto, come il launcher Android dell'app. -->
  <meta name="apple-mobile-web-app-title" content="Volley Stratego">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Statistiche di stagione — Volley Scout Stratego</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Il testo qui sotto è ciò che si vede mentre il motore di Flutter scarica, e
    l'unica cosa che resta a chi ha JavaScript disattivato. Flutter disegna su
    canvas, quindi per un motore di ricerca questa pagina è vuota: la vetrina
    vera è il sito su Google Sites, che è testo indicizzabile e linka qui
    (vedi "La vetrina" in docs/dati-stagionali.md).
    Il caricatore rimpiazza il contenuto del body, quindi questo blocco sparisce
    da sé quando l'app parte.
  -->
  <noscript>
    <h1>Statistiche di stagione — Volley Scout Stratego</h1>
    <p>
      Questa pagina ha bisogno di JavaScript. I dati restano comunque sul tuo
      dispositivo: non vengono caricati da nessuna parte.
    </p>
  </noscript>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
